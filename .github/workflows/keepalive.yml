# Supabase 무료 요금제 일시정지 방지
# 무료 프로젝트는 7일 동안 DB 활동이 적으면 일시정지돼요. 3일마다 아주 작은 조회를 한 번 보내 활동을 만들어요.
# - 공개용 anon 키만 씀 (앱에도 들어 있는 키). 로그인하지 않은 요청이라 데이터는 절대 돌아오지 않음
# - 로그인 안 한 요청은 RLS 정책 안의 current_ledger() 실행 권한이 없어 Postgres 가 42501(permission denied)로 거절함
#   → 이 거절은 DB 가 깨어 있고 실제로 쿼리를 검사했다는 뜻이라 성공으로 침 (권한을 풀지 않는 게 더 안전)
# - service_role 키는 절대 넣지 마세요
# 설정: 저장소 → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL      = Vercel 의 VITE_SUPABASE_URL 과 같은 값 (https://프로젝트ID.supabase.co)
#   SUPABASE_ANON_KEY = Vercel 의 VITE_SUPABASE_ANON_KEY 와 같은 값
# 확인: Actions 탭 → keepalive → Run workflow 로 바로 실행해 볼 수 있어요 (초록색 ✓ 이면 성공)
name: keepalive

on:
  schedule:
    - cron: '0 0 */3 * *'   # 3일마다, UTC 0시 = 한국 오전 9시 (GitHub 사정으로 몇 시간 늦어질 수 있음)
  workflow_dispatch:         # Actions 화면에서 직접 실행

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase DB 조회 한 번
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 비밀 값을 저장소 Settings → Secrets and variables → Actions 에 등록해 주세요"
            exit 1
          fi
          # 실패하면(서버가 멈췄거나 주소가 틀림) 이 작업이 빨간색이 되고 GitHub 가 메일로 알려줌
          # apikey 헤더만 보냄: 새 형식 키(sb_publishable_...)는 Authorization: Bearer 로 보내면 401 이 남
          code=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "응답 코드: $code"
          # 200 이거나, DB 가 권한 검사로 거절한 42501 이면 정상 (DB 까지 도달했다는 뜻)
          if [ "$code" = "200" ] || grep -q '"42501"' body.txt; then
            echo "DB 응답 확인 — 정상"
            exit 0
          fi
          echo "서버 응답: $(head -c 300 body.txt)"
          case "$code" in
            401) echo "::error::Supabase 가 키를 거절했어요(401). SUPABASE_ANON_KEY 값이 Vercel 의 VITE_SUPABASE_ANON_KEY 와 똑같은지(앞뒤 공백·줄바꿈 없이) 확인해 주세요" ;;
            404) echo "::error::주소를 찾지 못했어요(404). SUPABASE_URL 이 https://프로젝트ID.supabase.co 형식인지 확인해 주세요" ;;
            *)   echo "::error::Supabase 응답이 $code 예요. 프로젝트가 일시정지됐다면 대시보드에서 Resume project 를 눌러 주세요" ;;
          esac
          exit 1
