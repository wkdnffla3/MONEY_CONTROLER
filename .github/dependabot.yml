# 패키지 보안 업데이트 자동 알림: 취약점이 있거나 새 버전이 나오면 GitHub가 PR을 만들어 줌.
# PR이 오면 Actions 테스트가 자동으로 돌고, ✅ 이면 Merge 하면 됨 (Vercel 이 자동 재배포).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # 작은 업데이트는 PR 하나로 묶음 (큰 버전 업은 따로)
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
